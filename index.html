<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    width: 100%;
}

#archive {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}


/* =========================
   포스트
========================= */

.post {
    width: 100%;
    padding: 25px 24px 35px;
    border-bottom: 1px solid #eeeeee;
}


/* =========================
   프로필
========================= */

.post-header {
    width: 100%;
    display: flex;
    align-items: center;
    margin-bottom: 17px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 9px;
}

.profile-img {
    width: 36px;
    height: 36px;

    border-radius: 50%;

    object-fit: cover;

    display: block;

    background: #eee;
}

.profile-name {
    font-size: 14px;
    font-weight: 600;
}

.fairy {
    font-size: 17px;
    line-height: 1;
}


/* =========================
   사진
========================= */

.gallery {
    width: 100%;
    aspect-ratio: 1 / 1;

    overflow: hidden;

    background: #000;

    border-radius: 20px;
}

.gallery.multi {
    display: flex;

    overflow-x: auto;

    scroll-snap-type: x mandatory;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;
}

.gallery.multi::-webkit-scrollbar {
    display: none;
}

.gallery img {
    width: 100%;
    height: 100%;

    flex: 0 0 100%;

    display: block;

    object-fit: contain;

    object-position: center;

    scroll-snap-align: start;
}


/* =========================
   동그라미
========================= */

.dots {
    width: 100%;

    height: 34px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 7px;
}

.dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #b5b5b5;

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}

.dot.active {
    background: #111;

    transform: scale(1.05);
}


/* =========================
   코멘트
========================= */

.caption {
    margin: 7px 2px 0;

    padding: 0;

    font-size: 14px;

    line-height: 1.6;

    font-weight: 400;

    white-space: pre-wrap;

    word-break: keep-all;
}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    #archive {
        width: 100%;
    }

    .post {
        padding-left: 24px;
        padding-right: 24px;
    }

    .profile-img {
        width: 36px;
        height: 36px;
    }

    .profile-name {
        font-size: 14px;
    }

    .fairy {
        font-size: 17px;
    }

    .caption {
        font-size: 14px;
    }
}


/* =========================
   큰 화면
========================= */

@media (min-width: 601px) {

    body {
        background: #f3f3f3;
    }

    #archive {
        background: #fff;
        min-height: 100vh;
    }
}
</style>

const imageNumbers = [];

    imageNumbers.push(i);
}


/* =====================================================
   사이트 생성
===================================================== */

const archive =
    document.getElementById("archive");

let imageIndex = 0;


posts.forEach((post) => {

    const count = post[0];

    const caption = post[1];


    /* 포스트 */

    const article =
        document.createElement("article");

    article.className = "post";


    /* =========================
       프로필
    ========================= */

    const header =
        document.createElement("div");

    header.className = "post-header";


    const profile =
        document.createElement("div");

    profile.className = "profile";


    const profileImg =
        document.createElement("img");

    profileImg.className =
        "profile-img";

    profileImg.src =
        profileImage;

    profileImg.alt =
        "띠띠";


    const name =
        document.createElement("span");

    name.className =
        "profile-name";

    name.textContent =
        "띠띠";


    const fairy =
        document.createElement("span");

    fairy.className =
        "fairy";

    fairy.textContent =
        "🦋";


    profile.appendChild(profileImg);

    profile.appendChild(name);

    profile.appendChild(fairy);

    header.appendChild(profile);

    article.appendChild(header);


    /* =========================
       사진
    ========================= */

    const gallery =
        document.createElement("div");

    gallery.className =
        count > 1
        ? "gallery multi"
        : "gallery";


    const usedImages = [];


    for (let i = 0; i < count; i++) {

        const number =
            imageNumbers[imageIndex];


        if (number === undefined) {
            break;
        }


        usedImages.push(number);


        const img =
            document.createElement("img");


        img.src =
            `IMG_${number}.jpeg`;


        img.alt =
            `IMG_${number}`;


        img.loading =
            "lazy";


        gallery.appendChild(img);


        imageIndex++;
    }


    /* 사진이 하나라도 있을 때만 표시 */

    if (usedImages.length > 0) {

        article.appendChild(gallery);


        /* =========================
           동그라미
        ========================= */

        if (usedImages.length > 1) {

            const dots =
                document.createElement("div");

            dots.className =
                "dots";


            usedImages.forEach((number, index) => {

                const dot =
                    document.createElement("span");

                dot.className =
                    index === 0
                    ? "dot active"
                    : "dot";


                dots.appendChild(dot);

            });


            article.appendChild(dots);


            /* 사진을 넘기면
               동그라미도 같이 변경 */

            gallery.addEventListener(
                "scroll",
                () => {

                    const width =
                        gallery.clientWidth;


                    if (!width) {
                        return;
                    }


                    const currentIndex =
                        Math.round(
                            gallery.scrollLeft /
                            width
                        );


                    const allDots =
                        dots.querySelectorAll(
                            ".dot"
                        );


                    allDots.forEach(
                        (dot, index) => {

                            dot.classList.toggle(
                                "active",
                                index === currentIndex
                            );

                        }
                    );

                }
            );

        }

    }


    /* =========================
       코멘트
    ========================= */

    if (caption.trim() !== "") {

        const text =
            document.createElement("p");

        text.className =
            "caption";

        text.textContent =
            caption;


        article.appendChild(text);

    }


    archive.appendChild(article);

});

</script>

</body>
</html>
